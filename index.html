        .custom-scrollbar::-webkit-scrollbar {
            height: 8px;
            width: 8px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: #111827;
            border-radius: 4px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #374151;
            border-radius: 4px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover {
            background: #4b5563;
        }

        .cat-alkali { background-color: rgba(225, 29, 72, 0.2); border-color: rgba(225, 29, 72, 0.6); color: #fecdd3; }

        .cat-transition { background-color: rgba(14, 116, 144, 0.25); border-color: rgba(14, 116, 144, 0.6); color: #cff4fe; }
        .cat-transition:hover, .highlight-transition { background-color: rgba(14, 116, 144, 0.5); box-shadow: 0 0 12px rgba(14, 116, 144, 0.5); }

        .cat-post-transition:hover, .highlight-post-transition { background-color: rgba(16, 185, 129, 0.45); box-shadow: 0 0 12px rgba(16, 185, 129, 0.5); }

        .cat-metalloid:hover, .highlight-metalloid { background-color: rgba(147, 51, 234, 0.45); box-shadow: 0 0 12px rgba(147, 51, 234, 0.5); }

        .cat-reactive-nonmetal { background-color: rgba(16, 185, 129, 0.3); border-color: rgba(52, 211, 153, 0.7); color: #d1fae5; }
        .cat-reactive-nonmetal:hover, .highlight-reactive-nonmetal { background-color: rgba(16, 185, 129, 0.55); box-shadow: 0 0 12px rgba(52, 211, 153, 0.6); }

        .dimmed {
            opacity: 0.15 !important;

            grid-template-columns: repeat(18, minmax(58px, 1fr));
            gap: 4px;
            min-width: 1100px;

                    <option value="transition">Transition Metals</option>

            </div>
        </div>
    </header>

    <main class="max-w-[1400px] mx-auto px-4 py-6 w-full flex-grow">

            <div id="legendContainer" class="flex flex-wrap gap-2 text-xs">

        </div>

        <div class="overflow-x-auto custom-scrollbar pb-4">

                    <span class="w-8 h-[1px] bg-gray-800"></span>
                </div>
                
                <div id="fBlockGrid" class="ptable-grid mx-auto">
                    <!-- f-Block Lanthanides (57-71) & Actinides (89-103) rendered neatly directly below columns 3-17 -->

            </div>
        </div>

    </main>

            { num: 66, sym: "Dy", name: "Dysprosium", mass: "162.50", cat: "lanthanide", fRow: 1, fCol: 10, disc: "1886" },
            { num: 67, sym: "Ho", name: "Holmium", mass: "164.93", cat: "lanthanide", fRow: 1, fCol: 11, disc: "1878" },
            { num: 68, sym: "Er", name: "Erbium", mass: "167.26", cat: "lanthanide", fRow: 1, fCol: 12, disc: "1842" },
            { num: 69, sym: "Tm", name: "Thulium", mass: "168.93", cat: "lanthanide", fRow: 1, fCol: 13, disc: "1879" },
            { num: 70, sym: "Yb", name: "Ytterbium", mass: "173.05", cat: "lanthanide", fRow: 1, fCol: 14, disc: "1878" },
            { num: 71, sym: "Lu", name: "Lutetium", mass: "174.97", cat: "lanthanide", fRow: 1, fCol: 15, disc: "1907" },

            // f-block Actinides (89-103)
            { num: 89, sym: "Ac", name: "Actinium", mass: "(227)", cat: "actinide", fRow: 2, fCol: 1, disc: "1899" },
            { num: 90, sym: "Th", name: "Thorium", mass: "232.04", cat: "actinide", fRow: 2, fCol: 2, disc: "1829" },
            { num: 91, sym: "Pa", name: "Protactinium", mass: "231.04", cat: "actinide", fRow: 2, fCol: 3, disc: "1913" },
            { num: 92, sym: "U", name: "Uranium", mass: "238.03", cat: "actinide", fRow: 2, fCol: 4, disc: "1789" },
            { num: 93, sym: "Np", name: "Neptunium", mass: "(237)", cat: "actinide", fRow: 2, fCol: 5, disc: "1940" },
            { num: 94, sym: "Pu", name: "Plutonium", mass: "(244)", cat: "actinide", fRow: 2, fCol: 6, disc: "1940" },
            { num: 95, sym: "Am", name: "Americium", mass: "(243)", cat: "actinide", fRow: 2, fCol: 7, disc: "1944" },
            { num: 96, sym: "Cm", name: "Curium", mass: "(247)", cat: "actinide", fRow: 2, fCol: 8, disc: "1944" },
            { num: 97, sym: "Bk", name: "Berkelium", mass: "(247)", cat: "actinide", fRow: 2, fCol: 9, disc: "1949" },
            { num: 98, sym: "Cf", name: "Californium", mass: "(251)", cat: "actinide", fRow: 2, fCol: 10, disc: "1950" },
            { num: 99, sym: "Es", name: "Einsteinium", mass: "(252)", cat: "actinide", fRow: 2, fCol: 11, disc: "1952" },
            { num: 100, sym: "Fm", name: "Fermium", mass: "(257)", cat: "actinide", fRow: 2, fCol: 12, disc: "1952" },
            { num: 101, sym: "Md", name: "Mendelevium", mass: "(258)", cat: "actinide", fRow: 2, fCol: 13, disc: "1955" },
            { num: 102, sym: "No", name: "Nobelium", mass: "(259)", cat: "actinide", fRow: 2, fCol: 14, disc: "1966" },
            { num: 103, sym: "Lr", name: "Lawrencium", mass: "(266)", cat: "actinide", fRow: 2, fCol: 15, disc: "1961" }
        ];

        const categoriesMap = {
            "alkali": "Alkali Metals",
            "alkaline": "Alkaline Earth",
            "transition": "Transition Metals",
            "post-transition": "Post-Transition",
            "metalloid": "Metalloids",
            "reactive-nonmetal": "Reactive Nonmetals",
            "halogen": "Halogens",
            "noble": "Noble Gases",
            "lanthanide": "Lanthanides",
            "actinide": "Actinides"
        };

        function initLegend() {
            const container = document.getElementById('legendContainer');
            Object.keys(categoriesMap).forEach(catKey => {
                const btn = document.createElement('button');
                btn.className = `cat-${catKey} border px-2.5 py-1 rounded-md text-[11px] font-medium transition flex items-center gap-1.5 cursor-pointer`;
                btn.innerHTML = `<span class="w-2 h-2 rounded-full bg-current opacity-75"></span>${categoriesMap[catKey]}`;
                btn.addEventListener('click', () => filterByCategory(catKey));
                container.appendChild(btn);
            });
        }

        function createElementCard(el) {
            const card = document.createElement('div');
            card.id = `el-${el.num}`;
            card.className = `element-card cat-${el.cat} border rounded-lg p-1 flex flex-col justify-between cursor-pointer aspect-square text-center relative select-none`;
            
            card.innerHTML = `
                <div class="text-[9px] opacity-75 font-mono text-left leading-none">${el.num}</div>
                <div class="text-base font-bold tracking-tight my-0.5 leading-none">${el.sym}</div>
                <div class="text-[9px] truncate font-medium opacity-90 leading-none">${el.name}</div>
                <div class="text-[8px] opacity-60 font-mono leading-none mt-0.5">${el.mass}</div>
            `;

            card.addEventListener('click', () => openElementModal(el));
            return card;
        }

        function renderGrids() {
            const mainGrid = document.getElementById('periodicGrid');
            const fGrid = document.getElementById('fBlockGrid');

            mainGrid.innerHTML = '';
            fGrid.innerHTML = '';

            // Map standard 7-row main table grid layout (18 columns)
            const mainGridMap = {};
            elementsData.filter(e => !e.fRow).forEach(e => {
                mainGridMap[`${e.row}-${e.col}`] = e;
            });

            // Insert placeholder indicators for 57-71 and 89-103 in row 6 & 7 col 3
            mainGridMap['6-3'] = { placeholder: true, label: "57-71", name: "Lanthanides", cat: "lanthanide" };
            mainGridMap['7-3'] = { placeholder: true, label: "89-103", name: "Actinides", cat: "actinide" };

            for (let r = 1; r <= 7; r++) {
                for (let c = 1; c <= 18; c++) {
                    const el = mainGridMap[`${r}-${c}`];
                    if (el) {
                        if (el.placeholder) {
                            const ph = document.createElement('div');
                            ph.className = `cat-${el.cat} border border-dashed rounded-lg p-1 flex flex-col items-center justify-center text-center cursor-pointer opacity-80 hover:opacity-100 transition`;
                            ph.innerHTML = `<span class="text-[10px] font-bold">${el.label}</span><span class="text-[8px] leading-tight">${el.name}</span>`;
                            ph.addEventListener('click', () => filterByCategory(el.cat));
                            mainGrid.appendChild(ph);
                        } else {
                            mainGrid.appendChild(createElementCard(el));
                        }
                    } else {
                        const empty = document.createElement('div');
                        empty.className = 'w-full h-full';
                        mainGrid.appendChild(empty);
                    }
                }
            }

            // Map f-block elements symmetrically under columns 3 to 17
            const fGridMap = {};
            elementsData.filter(e => e.fRow).forEach(e => {
                fGridMap[`${e.fRow}-${e.fCol}`] = e;
            });

            // Render f-Block symmetrically centered: Columns 1 & 2 label/spacing, columns 3-17 f-elements
            for (let r = 1; r <= 2; r++) {
                // Col 1 & 2 empty spacer/label in f-block grid to align directly with main table's col 3 to 17
                const labelCell = document.createElement('div');
                labelCell.className = 'col-span-2 flex items-center justify-end pr-2 text-[11px] font-semibold text-gray-400 tracking-wide';
                labelCell.innerText = r === 1 ? 'Lanthanides' : 'Actinides';
                fGrid.appendChild(labelCell);

                for (let c = 1; c <= 15; c++) {
                    const el = fGridMap[`${r}-${c}`];
                    if (el) {
                        fGrid.appendChild(createElementCard(el));
                    }
                }

                // Col 18 empty spacer for complete 18-col alignment symmetry
                const spacer = document.createElement('div');
                fGrid.appendChild(spacer);
            }
        }

        let activeFilter = 'all';

        function applyFilters() {
            const query = document.getElementById('searchInput').value.toLowerCase().trim();

            elementsData.forEach(el => {
                const card = document.getElementById(`el-${el.num}`);
                if (!card) return;

                const matchesSearch = !query || 
                    el.name.toLowerCase().includes(query) || 
                    el.sym.toLowerCase().includes(query) || 
                    el.num.toString() === query;

                const matchesCategory = activeFilter === 'all' || el.cat === activeFilter;

                if (matchesSearch && matchesCategory) {
                    card.classList.remove('dimmed');
                } else {
                    card.classList.add('dimmed');
                }
            });
        }

        function filterByCategory(catKey) {
            if (activeFilter === catKey) {
                activeFilter = 'all';
                document.getElementById('categoryFilter').value = 'all';
            } else {
                activeFilter = catKey;
                document.getElementById('categoryFilter').value = catKey;
            }
            applyFilters();
        }

        function openElementModal(el) {
            const modal = document.getElementById('elementModal');
            const content = document.getElementById('modalContent');

            content.innerHTML = `
                <div class="flex items-center gap-4 mb-4">
                    <div class="cat-${el.cat} w-20 h-20 rounded-xl border flex flex-col items-center justify-center shadow-lg">
                        <span class="text-xs opacity-75 font-mono">${el.num}</span>
                        <span class="text-2xl font-bold">${el.sym}</span>
                        <span class="text-[10px] opacity-80 font-mono">${el.mass}</span>
                    </div>
                    <div>
                        <h2 class="text-2xl font-bold text-white">${el.name}</h2>
                        <span class="inline-block mt-1 px-2.5 py-0.5 rounded-full text-xs font-medium cat-${el.cat} border">
                            ${categoriesMap[el.cat]}
                        </span>
                    </div>
                </div>

                <p class="text-gray-300 text-sm mb-6 leading-relaxed">
                    ${el.summary || `${el.name} is a chemical element with symbol ${el.sym} and atomic number ${el.num}.`}
                </p>

                <div class="grid grid-cols-2 gap-3 text-xs bg-gray-800/50 p-4 rounded-xl border border-gray-800">
                    <div>
                        <span class="text-gray-400 block">Atomic Number</span>
                        <span class="font-semibold text-gray-200 text-sm">${el.num}</span>
                    </div>
                    <div>
                        <span class="text-gray-400 block">Standard Atomic Weight</span>
                        <span class="font-semibold text-gray-200 text-sm">${el.mass} u</span>
                    </div>
                    <div>
                        <span class="text-gray-400 block">Discovered Year</span>
                        <span class="font-semibold text-gray-200 text-sm">${el.disc || 'N/A'}</span>
                    </div>
                    <div>
                        <span class="text-gray-400 block">Block Placement</span>
                        <span class="font-semibold text-gray-200 text-sm">${el.fRow ? 'f-block' : 's/p/d-block'}</span>
                    </div>
                </div>
            `;

            modal.classList.remove('hidden');
        }

        // Event Listeners Initialization
        document.addEventListener('DOMContentLoaded', () => {
            initLegend();
            renderGrids();

            document.getElementById('searchInput').addEventListener('input', applyFilters);
            
            document.getElementById('categoryFilter').addEventListener('change', (e) => {
                activeFilter = e.target.value;
                applyFilters();
            });

            document.getElementById('resetBtn').addEventListener('click', () => {
                document.getElementById('searchInput').value = '';
                document.getElementById('categoryFilter').value = 'all';
                activeFilter = 'all';
                applyFilters();
            });

            document.getElementById('closeModal').addEventListener('click', () => {
                document.getElementById('elementModal').classList.add('hidden');
            });

            document.getElementById('elementModal').addEventListener('click', (e) => {
                if (e.target === document.getElementById('elementModal')) {
                    document.getElementById('elementModal').classList.add('hidden');
                }
            });
        });
    </script>
</body>
</html>
